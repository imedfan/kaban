<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Kaban v0.2 — Карточки, баннеры, плашки</title>
<link rel="stylesheet" href="../common.css"><link rel="stylesheet" href="../board.css"><link rel="stylesheet" href="../task-details.css"><link rel="stylesheet" href="v02.css">
<style>
html,body{height:1060px}
.sheet{position:relative;width:1440px;height:1060px;background:var(--bg-content);padding:28px 36px;display:flex;flex-direction:column;gap:18px}
h1{font-size:22px;font-weight:750;letter-spacing:-.02em}
.lead{font-size:12px;color:var(--text-2);max-width:1180px;line-height:17px;margin-top:4px}
h2{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:8px}
h2 .faint{font-weight:500;font-size:11.5px}
.row{display:flex;gap:10px;align-items:flex-start}
.cell{width:219px;display:flex;flex-direction:column;gap:6px}
.cap{font-size:10.5px;color:var(--text-2);line-height:14px}
.cap .mono{font-size:10px;color:var(--text)}
.cap b{color:var(--text);font-weight:650}
.bn{width:1180px;display:flex;flex-direction:column;gap:6px}
.bnr{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
.bnr .l{font-size:10.5px;color:var(--text-3);line-height:13px}
.bnr .l .mono{color:var(--text-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.box2{background:var(--bg-lane);border-radius:14px;box-shadow:inset 0 0 0 .5px var(--sep);padding:10px 12px}
.hdrs{display:flex;gap:6px;flex-wrap:wrap}
.hdrs .col{flex:none!important;width:206px;padding-bottom:6px}
.lane-h .ln{white-space:nowrap}
.fd{background:var(--bg-card);border-radius:12px;box-shadow:var(--sh-card);padding:2px 12px}
.fd .ev:last-child{border-bottom:none}
.qws{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qws .mac-card{background:var(--bg-card)}
.qws .cap{margin-top:4px}
</style></head>
<body><div class="sheet" id="root"></div><script src="../components.js"></script><script src="v02.js"></script>
<script>
const C=(o,cap)=>`<div class="cell">${card2(Object.assign({w:219},o))}<div class="cap">${cap}</div></div>`;
const hdr=(kind,name,wip,m)=>col2(kind,name,wip,[],'',m).replace('<div class="empty">Пусто</div>','');
document.getElementById('root').innerHTML=`
<div><h1>Kaban v0.2 · карточки, баннеры, плашки</h1>
<div class="lead">Новые состояния по журналу решений 3 окт, архитектуре v0.10.1 и спеке v0.7.1. Правила прежние: цвет карточки — только статус, проект — маскот и фактура края, не больше двух бейджей. Янтарный — нужно внимание, серый — спокойное ожидание; красный остаётся только у инцидентов безопасности и здесь не встречается. Флаги Мака и пулов — баннер над доской, флаги моделей — тонкий баннер и знак в шапке столбца, флаги проекта — плашка в шапке дорожки; задачи под флагом остаются <span class="mono">queued</span>.</div></div>

<div><h2>Карточки <span class="faint">статус · reason · подпись в статус-строке</span></h2>
<div class="row">
${C({p:'shop',id:44,t:'Цены в копейках во всём API',s:'retry',label:'Попытка 2/3',meta:'повтор через 1:45',badges:[['','gate_failed','gates']]},'<b>retry_wait · gate_failed.</b> 3 попытки, паузы <span class="mono">[30 с, 2 мин]</span> — пример, ждёт решения Артёма. После красного гейта продолжает в том же клоне.')}
${C({p:'shop',id:42,t:'Пагинация курсором в /orders',s:'running',meta:'12 мин',progress:55,badges:[['bnc','↩ 2/3','undo']]},'<b>Бейдж возврата «↩ 2/3»</b> — счётчик возвратов в эту стадию, не статус. Счётчик попыток после возврата начинается заново.')}
${C({p:'shop',id:47,t:'Импорт прайса из 1С',s:'runlimit',label:'Лимит запусков',meta:'12/12',badges:[['wipsnap','WIP сохранён','history']]},'<b>waiting_human · run_limit.</b> <span class="mono">max_runs_per_task</span> = 12 автозапусков. Перед откатом клона состояние сохранено в <span class="mono">refs/kaban/wip/&lt;run-id&gt;</span>.')}
${C({p:'shop',id:35,t:'Кэш каталога в Redis',s:'subst',label:'Подмена модели',meta:'15:12',line:['am','Подмена: Opus 4.5 <span class="arr">→</span> Sonnet 4','alert']},'<b>waiting_human · model_substituted.</b> Процесс остановлен до первого вызова инструмента, попытка не списана, результат не принят.')}
${C({p:'shop',id:39,t:'Повтор вебхуков оплаты',s:'queued',label:'Ждёт квоту Om',meta:'сброс через 13д'},'<b>queued · quota_om</b> — спокойный серый. Не держит очередь и WIP-слот, ретрай попытку не списывает.')}
${C({p:'shop',id:34,t:'Логи запросов без PII',s:'queued',label:'На модели флаг',meta:'Opus 4.5'},'<b>queued · model_flag</b> — на модели стадии висит флаг (недоступна или подменена). Стартует сама, когда флаг снимут.')}
</div></div>

<div><h2>Баннеры над доской <span class="faint">один на флаг · текущие запуски доигрывают</span></h2>
<div class="bn">
 <div class="bnr"><div class="l">Пул · <span class="mono">usage_exhausted: om</span><br>знак только на стадиях Om</div>${BANNERS.om}</div>
 <div class="bnr"><div class="l">Пул · <span class="mono">usage_exhausted: cm</span></div><div class="flagbar qx">${ic('hourglass',14)}<b>Cm исчерпан · 1 стадия · до 17.10, 05:40</b><span class="muted2">· стоят стадии на <span class="mono">composer-*</span> (знак в шапке), именные модели работают</span><span class="sp"></span><span class="cnt2">сброс через 13д 13ч</span><span class="btn sm">Сменить модель стадии…</span></div></div>
 <div class="bnr"><div class="l">Мак · <span class="mono">usage_exhausted: unknown</span><br>пул неизвестен — встаёт весь Мак</div><div class="flagbar qx">${ic('hourglass',14)}<b>Квота Cursor исчерпана до 01.11</b><span class="muted2">· неизвестно, какой пул: новые запуски не стартуют во всех проектах, текущие доигрывают · дата из текста ошибки</span><span class="sp"></span><span class="btn sm">Снять флаг</span></div></div>
 <div class="bnr"><div class="l">Модель · <span class="mono">model_flag: unavailable</span><br>без блока «Ответила»</div>${BANNERS.unav}</div>
 <div class="bnr"><div class="l">Модель · <span class="mono">model_flag: substituted</span><br>один баннер на модель</div>${BANNERS.subst}</div>
</div></div>

<div class="two">
 <div><h2>Шапка дорожки <span class="faint">флаги проекта</span></h2>
  <div class="box2" style="display:flex;flex-direction:column;gap:8px">
   <div class="lane-h" style="padding:0">${mascotFace('🐗','sad',24)}<b class="ln">kaban</b><span class="sp"></span><span class="lflag fl-amber">${ic('alert',11)}<b>Пайплайн не запустится:</b> нет модели у Test, AI Review<span class="btn sm">Указать модели</span></span></div>
   <div class="cap"><span class="mono">unavailable: pipeline_invalid</span> — «Указать модели» открывает редактор на первой стадии с ошибкой. Backlog принимает задачи.</div>
   <div class="lane-h" style="padding:0">${mascotFace('🐙','sad',24)}<b class="ln">mobile-app</b><span class="sp"></span><span class="lflag fl-amber">${ic('plug',11)}<b>Запуски остановлены: лишний MCP-сервер «jira»</b><span class="btn sm">Настройки MCP</span><span class="btn sm">${ic('refresh',9)}Проверить снова</span></span></div>
   <div class="cap"><span class="mono">unavailable: mcp_unexpected</span> — fail closed: CLI видит сервер вне собранного конфига, запуск не стартует. Янтарный: это остановка, а не инцидент.</div>
  </div></div>
 <div><h2>Знак в шапке столбца <span class="faint">модель стадии и её пул</span></h2>
  <div class="box2"><div class="hdrs">
   ${hdr('agent','Dev','1/3',{id:'composer-1'})}${hdr('test','Test','0/2',{id:'sonnet-4.5',mk:'om'})}${hdr('review','AI Review','0/2',{id:'opus-4.5',mk:'subst'})}
   ${hdr('review','Docs Review','0/1',{id:'opus-4.1',mk:'unav'})}${hdr('test','Test','0/2',{mk:'none'})}${hdr('review','AI Review','0/1',{mk:'auto'})}
  </div><div class="cap">Обычно — серая строка «модель · пул». Янтарь — стадия стоит и нужно решение (пул исчерпан, подмена, нет модели, <span class="mono">auto</span>). Серая рамка — модель недоступна, ждём пробу.</div></div></div>
</div>

<div class="two">
 <div><h2>Строки ленты</h2>
  <div class="fd">
   <div class="ev am"><span class="g">${ic('alert',12)}</span><div><div class="h">Остановлено: Cursor ответил не той моделью <span class="evcode">model_substituted</span></div><div class="s">запрошена Opus 4.5 (<span class="mono">opus-4.5</span>), ответила Sonnet 4 · запуск 7 · попытка не списана</div></div><span class="t">15:12</span></div>
   <div class="ev grey"><span class="g">${ic('info',12)}</span><div><div class="h">Модель не подтверждена <span class="evcode">model_unconfirmed</span></div><div class="s">имени «claude-4-sonnet-thinking» из <span class="mono">system/init</span> нет в справочнике · запуск продолжен</div></div><span class="t">13:40</span></div>
   <div class="ev"><span class="g">${ic('history',12)}</span><div><div class="h">Состояние клона сохранено перед откатом</div><div class="s"><span class="mono">refs/kaban/wip/r-0412</span> · 7 файлов, +184 −22 · после краша</div></div><span class="t">12:58</span></div>
  </div></div>
 <div><h2>Виджет квоты <span class="faint">опция, «Этот Мак» и менюбар · % израсходовано</span></h2>
  <div class="qws">
   <div><div class="mac-card">${quotaWidget({cm:46,om:62})}</div><div class="cap">Норма. Чёрточка — доля прошедшего цикла, пунктир — порог.</div></div>
   <div><div class="mac-card">${quotaWidget({cm:46,om:93})}</div><div class="cap">Om ниже порога: стадии Om ждут в <span class="mono">queued</span>.</div></div>
   <div><div class="mac-card">${quotaWidget({cm:46,om:null,upd:'34 мин назад'})}</div><div class="cap"><b>Нет данных</b> (nil, не 0%): серая полоса без заливки и без оценки порога.</div></div>
   <div><div class="mac-card">${quotaWidget({cm:null,om:null,upd:'ошибка'}).replace('neofic','')}</div><div class="cap">Оба пула без данных (токен протух) — работает только реактивная схема.</div></div>
  </div></div>
</div>`;
</script></body></html>
