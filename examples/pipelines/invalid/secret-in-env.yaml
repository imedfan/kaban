# Replace <model-id> with an explicit id from cursor-agent --list-models before use.
# No default model and no auto. Synthetic examples; inspect gate commands before running.
# Intentionally invalid: secret_in_env
version: 1
git: {preset: standard}
stages:
  - {id: backlog, kind: queue, on_success: dev}
  - id: dev
    kind: agent
    agent: {model: "<model-id>", permissions: write, env: {API_TOKEN: "synthetic-example-only"}}
    on_success: merge
  - {id: merge, kind: merge, on_conflict: {stage: dev, limit: 2}, on_success: done}
  - {id: done, kind: terminal}
