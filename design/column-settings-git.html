<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Kaban — Настройки столбца: Git</title>
<link rel="stylesheet" href="common.css"><link rel="stylesheet" href="settings.css"></head>
<body><div id="root"></div><script src="components.js"></script><script src="settings.js"></script>
<script>
const T = {
  a: '<span class="tg ro"><span class="a">Разрешено</span><span>Запрещено</span></span>',
  d: '<span class="tg ro"><span>Разрешено</span><span class="d">Запрещено</span></span>',
  L: `<span class="tg locked"><span class="d">${ic('lock',9)}Запрещено</span></span>`,
  inh: `<span class="pop">Наследует${ic('chevdown',9)}</span>`,
  ext: `<span class="pop c"><i></i>По условию: конфликт${ic('chevdown',9)}</span>`,
  alw: `<span class="pop a"><i></i>Разрешено${ic('chevdown',9)}</span>`,
};
const R = {a:'<span class="res a"><i></i>разрешено</span>', d:'<span class="res d"><i></i>запрещено</span>', c:'<span class="res c"><i></i>по условию</span>', l:`<span class="res l">${ic('lock',10)}всегда запрещено</span>`};
const row = (cmd, desc, proj, stage, res, cls='', note='') => `<tr class="${cls}"><td class="c1">${cmd[0]==='!'?`<span>${cmd.slice(1)}</span>`:`<span class="cmdn">${cmd}</span>`}<span class="desc">${desc}</span></td><td>${proj}</td><td>${stage}${note}</td><td>${res}</td></tr>`;
const left = `
<div class="box"><div class="box-h">Пресет проекта <span class="faint">задаётся на проект, стадия наследует и может сузить или расширить по условию</span><span class="sp"></span><span class="btn sm ghost">Git-политика проекта ${ic('chevright',9)}</span></div>
 <div class="presets">
  <div class="preset"><b><span class="radio"></span>Строгий</b><p>Агент только читает: <span class="mono">status diff log show</span>. Коммитит демон после зелёных гейтов: сообщение из <span class="mono">summary</span>, всё изменённое в клоне, кроме <span class="mono">.gitignore</span>.</p></div>
  <div class="preset on"><span class="tagp">в проекте</span><b><span class="radio"></span>Стандартный</b><p>Базовый: чтение + <span class="mono">add commit</span> в ветке задачи. Коммиты делает агент.</p></div>
  <div class="preset"><b><span class="radio"></span>Свободный</b><p>Стандартный + <span class="mono">stash rebase reset</span> (в т.ч. <span class="mono">--hard</span>) — только в своей ветке задачи. Жёсткие правила — во всех трёх.</p></div>
 </div></div>
<div class="prefill">${ic('sparkles',13)}<span>Предзаполнено из отказа <b>KBN-17</b>: разрешить <span class="cmd">git stash</span>. Уровень правила:</span><span class="seg" style="background:rgba(255,255,255,.6)"><span>Проект</span><span class="on">Стадия Dev</span></span><span class="sp"></span><span class="btn sm">Убрать</span></div>
<div class="box" style="flex:1;overflow:hidden">
 <table class="pol">
  <tr><th>Команда</th><th>Проект · Стандартный</th><th>Стадия Dev</th><th>Итог для Dev</th></tr>
  <tr class="grp"><td colspan="4">${ic('lock',10)} Жёсткие правила — не снимает ни один пресет, даже свободный</td></tr>
  ${row('!<span class="cmdn">push</span> в любой remote','',T.L,T.L,R.l,'lock')}
  ${row('!Сдвиг <span class="cmdn">main</span> и чужих веток','',T.L,T.L,R.l,'lock')}
  ${row('!Запись в <span class="cmdn">.kaban/</span>','',T.L,T.L,R.l,'lock')}
  ${row('!Слияние в <span class="cmdn">main</span> — только демон','',T.L,T.L,R.l,'lock')}
  <tr class="grp"><td colspan="4">Команды в ветке задачи</td></tr>
  ${row('status · diff · log · show','',T.a,T.inh,R.a)}
  ${row('add · commit','в ветке kaban/&lt;task&gt;',T.a,T.inh,R.a)}
  ${row('restore --staged','',T.a,T.inh,R.a)}
  ${row('rebase','ветки задачи',T.d,T.ext,R.c,'','')}
  ${row('stash','',T.d,T.alw,R.a,'new')}
  ${row('checkout main · rebase main','',T.d,T.inh,R.d)}
  ${row('reset --hard','',T.d,T.inh,R.d)}
  ${row('branch -D','удаление веток',T.d,T.inh,R.d)}
  ${row('tag · remote · config','',T.d,T.inh,R.d)}
  ${row('--force','любой флаг force',T.d,T.inh,R.d)}
 </table>
 <div style="display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:11px;color:var(--text-2)"><span class="ovr w" style="margin:0">rebase · по условию</span><span class="mono">when: return_reason == merge_conflict</span> — только на возврат после конфликта слияния<span class="sp"></span><span class="ovr new" style="margin:0">новое</span>не сохранено</div>
</div>`;
const right = `
<div class="box"><div class="box-h">${ic('shieldcheck',13)}Итоговая политика стадии Dev</div>
 <div class="eff">
  <div><div class="lab">Разрешено</div><div class="chips"><span class="cc a">status</span><span class="cc a">diff</span><span class="cc a">log</span><span class="cc a">show</span><span class="cc a">add</span><span class="cc a">commit</span><span class="cc a">restore --staged</span><span class="cc a n">stash</span></div></div>
  <div><div class="lab">По условию · расширено на стадии</div><div class="chips"><span class="cc c">rebase</span><span class="hint" style="align-self:center">при возврате после конфликта</span></div></div>
  <div><div class="lab">Запрещено · наследуется из проекта</div><div class="chips"><span class="cc d">checkout main</span><span class="cc d">rebase main</span><span class="cc d">reset --hard</span><span class="cc d">branch -D</span><span class="cc d">tag</span><span class="cc d">remote</span><span class="cc d">config</span><span class="cc d">--force</span><span class="cc d">всё вне списка</span></div></div>
  <div><div class="lab">${ic('lock',10)}Всегда · жёсткие правила</div><div class="chips"><span class="cc l">push</span><span class="cc l">сдвиг main / чужих веток</span><span class="cc l">запись .kaban/</span><span class="cc l">merge в main</span></div></div>
  <div class="hint">Отказов за запуск до остановки: <b style="color:var(--text)">5</b> → <span class="mono">waiting_human · git_denials</span>. Разовые разрешения «Разрешить один раз» живут до конца задачи и в политику не пишутся.</div>
 </div></div>
<div class="box"><div class="box-h">Стадии проекта</div>
 <div class="eff" style="gap:0;padding-top:4px"><table class="stages-mini">
  <tr><td>Dev</td><td>Стандартный, + <span class="mono">rebase</span> по условию, + <span class="mono">stash</span></td></tr>
  <tr><td>AI Review</td><td><span class="ovr n" style="margin:0">сужено</span> только <span class="mono">status diff log show</span> (read-only)</td></tr>
  <tr><td>Lint · Merge</td><td>агента нет — только демон</td></tr>
 </table></div></div>
<div class="yaml"><span class="cm"># .kaban/pipeline.yaml · stages[1]</span>
<span class="k">- id:</span> dev
  <span class="k">git:</span>
    <span class="k">extend:</span> [rebase]
    <span class="k">when:</span> <span class="s">return_reason == merge_conflict</span>
<span class="ad">+   allow: [stash]</span></div>`;
const foot = `${ic('info',12)}<span>Демон проверит файл и закоммитит только <span class="mono">.kaban/</span> в <span class="mono">main</span>. Действует со следующего запуска; идущий запуск доживает по старым.</span><span class="sp"></span><span class="dirty"></span><span>1 несохранённое изменение</span>`;
renderSettings(document.getElementById('root'), 'Права и git', left, right, foot);
</script></body></html>
