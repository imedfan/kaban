name: CI

on:
  push:
  pull_request:

jobs:
  context:
    name: Project context and source originals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check documents, design originals and Drive import
        run: python3 tools/check-project-context.py

  linux:
    name: Linux (Swift 6)
    runs-on: ubuntu-latest
    container:
      image: swift:6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SQLite headers and smoke runtime
        run: apt-get update && apt-get install -y libsqlite3-dev python3

      - name: Build
        run: swift build

      - name: Test
        run: swift test
        env:
          KABAN_SCENARIOS: Scenarios/M1

      - name: Daemon and CLI process smoke
        run: |
          kaban_bin_dir="$(swift build --show-bin-path)"
          python3 tools/smoke-daemon-transport.py --bin-dir "$kaban_bin_dir"

  macos:
    name: macOS (native app)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Build Kaban.app (unsigned)
        run: |
          derived_data="$(mktemp -d "${RUNNER_TEMP}/kaban-app-derived-data.XXXXXX")"
          trap 'rm -rf "$derived_data"' EXIT
          xcodebuild -project Kaban.xcodeproj -scheme Kaban \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$derived_data" \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
          smoke_result="$RUNNER_TEMP/kaban-native-smoke.json"
          smoke_log="$RUNNER_TEMP/kaban-native-smoke.log"
          rm -f "$smoke_result"
          open -n -W --stdout "$smoke_log" --stderr "$smoke_log" \
            "$derived_data/Build/Products/Debug/Kaban.app" --args \
            -ApplePersistenceIgnoreState YES --ui-smoke "$smoke_result"
          cat "$smoke_log"
          python3 - "$smoke_result" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as report:
              result = json.load(report)
          assert result["result"] == "passed", result
          print(json.dumps(result, ensure_ascii=False))
          PY
          control_result="$RUNNER_TEMP/kaban-native-task-controls.json"
          control_log="$RUNNER_TEMP/kaban-native-task-controls.log"
          rm -f "$control_result"
          open -n -W --stdout "$control_log" --stderr "$control_log" \
            "$derived_data/Build/Products/Debug/Kaban.app" --args \
            -ApplePersistenceIgnoreState YES --control-smoke "$control_result"
          cat "$control_log"
          python3 - "$control_result" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as report:
              result = json.load(report)
          assert result["result"] == "passed", result
          print(json.dumps(result, ensure_ascii=False))
          PY

      - name: Test
        run: swift test
        env:
          KABAN_SCENARIOS: Scenarios/M1

      - name: Daemon and CLI process smoke
        run: |
          kaban_bin_dir="$(swift build --show-bin-path)"
          python3 tools/smoke-daemon-transport.py --bin-dir "$kaban_bin_dir"
