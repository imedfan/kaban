name: CI

on:
  push:
  pull_request:

jobs:
  context:
    name: Project context and source originals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check documents, design originals and Drive import
        run: python3 tools/check-project-context.py

  linux:
    name: Linux (Swift 6)
    runs-on: ubuntu-latest
    container:
      image: swift:6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SQLite headers
        run: apt-get update && apt-get install -y libsqlite3-dev

      - name: Build
        run: swift build

      - name: Test
        run: swift test
        env:
          KABAN_SCENARIOS: Scenarios/M1

  macos:
    name: macOS (native app)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Build Kaban.app (unsigned)
        run: |
          derived_data="$(mktemp -d "${RUNNER_TEMP}/kaban-app-derived-data.XXXXXX")"
          trap 'rm -rf "$derived_data"' EXIT
          xcodebuild -project Kaban.xcodeproj -scheme Kaban \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$derived_data" \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
          "$derived_data/Build/Products/Debug/Kaban.app/Contents/MacOS/Kaban" \
            --ui-smoke "$RUNNER_TEMP/kaban-native-smoke.json"

      - name: Test
        run: swift test
        env:
          KABAN_SCENARIOS: Scenarios/M1
